goal: Standalone Vite frontend hosted as the product; Shopify React Router backend is the platform API. Shopify is a data source, not the Admin embed UI.
shop: htn26-rain-jackets.myshopify.com
out_of_scope: [openai, elastic_live_path, sentry_as_working, live_ads]

api:
  base: "${VITE_API_URL}"
  auth: Bearer copilot JWT/HMAC (SESSION_SECRET). Not App Bridge. After Shopify OAuth, backend redirects to FRONTEND_URL/insights?token=...
  default_shop: htn26-rain-jackets.myshopify.com
  endpoints:
    - { method: GET, path: /health, auth: false, notes: public JSON }
    - { method: GET, path: /api/session, auth: true, body: { connected, shop, storeName } }
    - { method: GET, path: /api/dashboard, auth: true, notes: merchant-scoped products, reviews, ads, metrics, findings }
    - { method: POST, path: /api/sync, auth: true, notes: Admin GraphQL product sync via unauthenticated.admin(shop) }
    - { method: POST, path: /api/import-demo, auth: true, notes: labelled demo reviews/ads, attribution demo }

progress:
  backend:
    status: done
    notes: >
      HMAC-SHA256 copilot JWT (shop + merchantId + exp) via SESSION_SECRET.
      After Shopify OAuth, afterAuth and /auth/copilot redirect to
      FRONTEND_URL/insights?token=... (default http://localhost:5173).
      CORS allowlist FRONTEND_URL / FRONTEND_ORIGIN on /api/* and /health.
      GET /api/session, GET /api/dashboard, POST /api/sync (unauthenticated.admin),
      POST /api/import-demo are merchant-scoped; 401 if token missing/bad.
      /health stays public. /app Polaris is debug-only. Did not edit shopify.app.toml
      (infra already set embedded=false). typecheck + test passed.
    files:
      - apps/backend/app/lib/copilot-session.server.ts
