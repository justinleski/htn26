app: backend

stack:
  language: typescript
  framework: shopify-react-router
  ui: polaris-web-components
  database: prisma/postgresql
  search: elasticsearch
  monitoring: sentry
  hosting: railway

auth:
  primary: shopify_session
  google_analytics: linked_integration_only
  notes: >
    Merchants authenticate via Shopify Admin embed.
    Google is never a login replacement — only a linked OAuth integration.

integrations:
  shopify:
    admin_graphql: true
    helpers: app/lib/shopify/products.server.ts
    schemas: app/lib/shopify/schemas.ts
  google_analytics:
    model: oauth_per_merchant
    no_merchant_api_keys: true
    status: deferred_no_live_pull
    app_env:
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - GOOGLE_REDIRECT_URI
    per_merchant_storage: MerchantIntegration
    helpers: app/lib/ga/client.server.ts
    settings_ui: app/routes/app.settings.tsx

data_pipeline:
  AdPerformance.source:
    - demo
    - csv
    - google_analytics
    - shopify
  loose_schemas: app/lib/schemas.ts
  strict_schemas: src/schemas.ts
  dashboard: src/dashboard/
  merchant_wiring: app/lib/merchant-data.server.ts
  entities:
    - Merchant
    - Product
    - Review
    - AdPerformance
    - Insight
    - Campaign
    - GenerationRun
    - MerchantIntegration

env_ownership:
  app_level_secrets:
    - SHOPIFY_API_KEY
    - SHOPIFY_API_SECRET
    - DATABASE_URL
    - SESSION_SECRET
    - ELASTIC_URL
    - ELASTIC_API_KEY
    - SENTRY_DSN
    - BACKBOARD_API_KEY
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - GOOGLE_REDIRECT_URI
  merchant_level:
    - MerchantIntegration.accessToken
    - MerchantIntegration.refreshToken
    - MerchantIntegration.metadata.propertyId

modules:
  shopify_server: app/shopify.server.ts
  db: app/db.server.ts
  env: app/lib/env.server.ts
  elastic: app/lib/elastic.server.ts
  sentry: app/lib/sentry.server.ts
  schemas: app/lib/schemas.ts
  integrations_types: app/lib/integrations/types.ts
  ga: app/lib/ga/
  shopify_products: app/lib/shopify/

routes:
  dashboard: app/routes/app._index.tsx
  import: app/routes/app.import.tsx
  campaigns: app/routes/app.campaigns.tsx
  settings: app/routes/app.settings.tsx
  health_embedded: app/routes/app.health.tsx
  health_public: app/routes/health.tsx

sibling_apps:
  frontend: >
    apps/frontend is a Vite marketing/shell app — not the Shopify Admin embed.
    Merchant UI for MVP lives here in Polaris routes under apps/backend.

railway:
  status: deferred_until_credentials
  shared_variables: use Railway Shared Variables for DATABASE_URL, ELASTIC_*, SENTRY_DSN, Shopify secrets
