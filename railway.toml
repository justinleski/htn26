# Documentation only — do NOT put [build]/[deploy] here.
# A root railway.toml applies to EVERY service sharing this repo, so a shared
# Dockerfile.api entry would break the web service. Configure per-service in
# Railway instead:
#   api: builder=DOCKERFILE, dockerfilePath=Dockerfile.api, healthcheckPath=/health
#   web: builder=DOCKERFILE, dockerfilePath=Dockerfile.web
#        (or Railpack: build `npm run build -w @htn26/frontend`,
#         start `npx serve@14.2.4 -s apps/frontend/dist -l tcp://0.0.0.0:$PORT`)
